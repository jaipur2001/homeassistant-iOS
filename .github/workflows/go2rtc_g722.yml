name: Build go2rtc G722

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/go2rtc-g722-trigger"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout helper repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Checkout upstream go2rtc v1.9.14
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.9.14 https://github.com/AlexxIT/go2rtc.git src
          cd src
          git rev-parse HEAD
          go version

      - name: Apply G.722 patch
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          codec = Path("src/pkg/core/codec.go")
          source = codec.read_text(encoding="utf-8")
          old = '''\tcase "opus":
\t\tcodec.Name = CodecOpus
\tcase "flac":
'''
          new = '''\tcase "opus":
\t\tcodec.Name = CodecOpus
\tcase "g722":
\t\tcodec.Name = CodecG722
\tcase "flac":
'''
          if source.count(old) != 1:
              raise SystemExit(f"ERROR: codec.go patch anchor count is {source.count(old)}, expected 1")
          codec.write_text(source.replace(old, new, 1), encoding="utf-8")

          api = Path("src/pkg/webrtc/api.go")
          source = api.read_text(encoding="utf-8")
          old = '''\t\t{
\t\t\tRTPCodecCapability: webrtc.RTPCodecCapability{
\t\t\t\tMimeType: webrtc.MimeTypePCMA, ClockRate: 8000,
\t\t\t},
\t\t\tPayloadType: 8,
\t\t},
\t} {
'''
          new = '''\t\t{
\t\t\tRTPCodecCapability: webrtc.RTPCodecCapability{
\t\t\t\tMimeType: webrtc.MimeTypePCMA, ClockRate: 8000,
\t\t\t},
\t\t\tPayloadType: 8,
\t\t},
\t\t{
\t\t\tRTPCodecCapability: webrtc.RTPCodecCapability{
\t\t\t\tMimeType: webrtc.MimeTypeG722, ClockRate: 8000,
\t\t\t},
\t\t\tPayloadType: 9,
\t\t},
\t} {
'''
          if source.count(old) != 1:
              raise SystemExit(f"ERROR: api.go patch anchor count is {source.count(old)}, expected 1")
          api.write_text(source.replace(old, new, 1), encoding="utf-8")

          test = Path("src/pkg/core/g722_patch_test.go")
          test.write_text(
              '''package core

import "testing"

func TestParseCodecStringG722Patch(t *testing.T) {
\tcodec := ParseCodecString("g722/8000")
\tif codec == nil {
\t\tt.Fatal("g722 codec was not parsed")
\t}
\tif codec.Name != CodecG722 {
\t\tt.Fatalf("unexpected codec name: %s", codec.Name)
\t}
\tif codec.ClockRate != 8000 {
\t\tt.Fatalf("unexpected clock rate: %d", codec.ClockRate)
\t}
}
''',
              encoding="utf-8",
          )
          PY

          grep -n -A3 -B2 'case "g722"' src/pkg/core/codec.go
          grep -n -A5 -B5 'MimeTypeG722' src/pkg/webrtc/api.go

      - name: Test patched source
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          go test ./pkg/core ./pkg/webrtc

      - name: Build ARM binaries
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          mkdir -p ../dist

          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 \
            go build -trimpath -ldflags="-s -w" \
            -o ../dist/go2rtc-linux-armv7 .

          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags="-s -w" \
            -o ../dist/go2rtc-linux-arm64 .

          chmod 0755 ../dist/go2rtc-linux-armv7 ../dist/go2rtc-linux-arm64
          file ../dist/go2rtc-linux-armv7 ../dist/go2rtc-linux-arm64
          sha256sum ../dist/go2rtc-linux-armv7 ../dist/go2rtc-linux-arm64 \
            | tee ../dist/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: go2rtc-v1.9.14-g722
          path: dist/
          if-no-files-found: error

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="go2rtc-v1.9.14-g722-01"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi

          cat > /tmp/release-notes.md <<'EOF'
          Custom go2rtc 1.9.14 G.722 build for the Weber-Schubert Home Assistant doorstation.

          Patch:
          - accepts g722/8000 in exec backchannel codec parsing
          - registers G.722 RTP payload type 9 with 8 kHz RTP clock in go2rtc WebRTC
          - otherwise based on upstream AlexxIT/go2rtc v1.9.14

          Binaries:
          - go2rtc-linux-armv7: door01 / Raspberry Pi 3B+ 32-bit
          - go2rtc-linux-arm64: home01 / Home Assistant ARM64 container override
          EOF

          gh release create "$TAG" \
            dist/go2rtc-linux-armv7 \
            dist/go2rtc-linux-arm64 \
            dist/SHA256SUMS.txt \
            --title "go2rtc v1.9.14 G.722 build 01" \
            --notes-file /tmp/release-notes.md
