name: Apply iOS 26 Kiosk Volume Fix Once

on:
  push:
    branches:
      - native-kiosk-audio-main
    paths:
      - .github/workflows/apply-ios26-volume-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: native-kiosk-audio-main

      - name: Restore robust iOS 26 kiosk volume control
        shell: bash
        run: |
          set -euo pipefail

          FILE="Sources/App/Notifications/NotificationManager.swift"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")

          old_view = '''    /// Hidden, off-screen volume view; `MPVolumeView` only drives the hardware volume while in a window.
              private lazy var volumeControlView = MPVolumeView(frame: CGRect(x: -2000, y: -2000, width: 1, height: 1))
          '''
          old_view = old_view.replace("              private", "    private").replace("          '''", "")

          new_view = '''    /// Persistent off-screen MPVolumeView used for kiosk hardware-volume control.
    /// It must remain attached to a window and must not be hidden for iOS to back it
    /// with the system volume control.
    private lazy var volumeControlView: MPVolumeView = {
        let view = MPVolumeView(frame: CGRect(x: -2000, y: -2000, width: 120, height: 40))
        view.showsVolumeSlider = true
        view.showsRouteButton = false
        return view
    }()
'''

          start_marker = "    private func setSystemVolume(_ level: Float) {"
          end_marker = "\n    private func playKioskMedia("

          new_func = '''    private func systemVolumeSlider(in view: UIView) -> UISlider? {
        if let slider = view as? UISlider {
            return slider
        }

        for subview in view.subviews {
            if let slider = systemVolumeSlider(in: subview) {
                return slider
            }
        }

        return nil
    }

    private func setSystemVolume(_ level: Float) {
        let clamped = min(max(level, 0), 1)

        Current.sceneManager.webViewControllerPromise
            .done(on: .main) { [weak self] webViewController in
                guard let self else { return }

                #if os(iOS) && !targetEnvironment(macCatalyst)
                let audioSession = AVAudioSession.sharedInstance()
                do {
                    try audioSession.setCategory(.playback, mode: .default, options: [])
                    try audioSession.setActive(true)
                } catch {
                    Current.Log.warning("Unable to activate audio session before kiosk volume change: \\(error)")
                }
                #endif

                if self.volumeControlView.superview == nil {
                    webViewController.view.addSubview(self.volumeControlView)
                }

                self.volumeControlView.setNeedsLayout()
                self.volumeControlView.layoutIfNeeded()

                let applyVolume: (TimeInterval) -> Void = { [weak self] delay in
                    DispatchQueue.main.asyncAfter(deadline: .now() + delay) {
                        guard let self else { return }

                        self.volumeControlView.setNeedsLayout()
                        self.volumeControlView.layoutIfNeeded()

                        guard let slider = self.systemVolumeSlider(in: self.volumeControlView) else {
                            Current.Log.error("Unable to locate system volume slider for kiosk command")
                            return
                        }

                        slider.setValue(clamped, animated: false)
                        slider.sendActions(for: .valueChanged)
                        slider.sendActions(for: .touchUpInside)

                        Current.Log.info(
                            "Kiosk requested system volume \\(clamped); MPVolumeView slider now \\(slider.value)"
                        )
                    }
                }

                applyVolume(0.05)
                applyVolume(0.20)
                applyVolume(0.50)

                #if os(iOS) && !targetEnvironment(macCatalyst)
                DispatchQueue.main.asyncAfter(deadline: .now() + 0.75) {
                    let actual = AVAudioSession.sharedInstance().outputVolume
                    Current.Log.info(
                        "Kiosk system volume verification: requested=\\(clamped), actual=\\(actual)"
                    )
                }
                #endif
            }.catch { error in
                Current.Log.error("Failed to set volume from push command: \\(error)")
            }
    }
'''

          robust_marker = "Kiosk system volume verification: requested="

          if robust_marker in source and "width: 120, height: 40" in source:
              print("Robust volume fix already present.")
          else:
              simple_view = "    /// Hidden, off-screen volume view; `MPVolumeView` only drives the hardware volume while in a window.\n    private lazy var volumeControlView = MPVolumeView(frame: CGRect(x: -2000, y: -2000, width: 1, height: 1))\n"
              if source.count(simple_view) != 1:
                  raise SystemExit(f"Expected exactly one old MPVolumeView block, found {source.count(simple_view)}")

              start = source.find(start_marker)
              if start < 0:
                  raise SystemExit("setSystemVolume start marker not found")

              end = source.find(end_marker, start)
              if end < 0:
                  raise SystemExit("playKioskMedia end marker not found")

              source = source.replace(simple_view, new_view, 1)
              source = source[:start] + new_func + source[end:]
              path.write_text(source, encoding="utf-8")
              print("Robust iOS 26 kiosk volume fix applied.")
          PY

          grep -nF 'width: 120, height: 40' "$FILE"
          grep -nF 'slider.sendActions(for: .valueChanged)' "$FILE"
          grep -nF 'applyVolume(0.05)' "$FILE"
          grep -nF 'applyVolume(0.20)' "$FILE"
          grep -nF 'applyVolume(0.50)' "$FILE"
          grep -nF 'Kiosk system volume verification:' "$FILE"

      - name: Commit fix and trigger Xcode 27 IPA build
        shell: bash
        run: |
          set -euo pipefail

          BUILD_WORKFLOW=".github/workflows/build-native-kiosk-audio-main.yml"
          SELF=".github/workflows/apply-ios26-volume-fix-once.yml"

          echo '' >> "$BUILD_WORKFLOW"
          echo '# Trigger rebuild after robust iOS 26 volume fix.' >> "$BUILD_WORKFLOW"

          git rm "$SELF"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add Sources/App/Notifications/NotificationManager.swift "$BUILD_WORKFLOW"

          git diff --cached --check
          git diff --cached --stat

          git commit -m 'Restore robust iOS 26 kiosk volume control'
          git push origin HEAD:native-kiosk-audio-main
