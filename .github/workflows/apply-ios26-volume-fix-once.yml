name: Apply iOS 26 Kiosk Volume Fix Once

on:
  push:
    branches:
      - native-kiosk-audio-main
    paths:
      - .github/workflows/apply-ios26-volume-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: native-kiosk-audio-main

      - name: Apply robust volume patch
        run: python3 .github/scripts/apply_ios26_volume_fix.py

      - name: Verify patch
        run: |
          set -euo pipefail
          FILE="Sources/App/Notifications/NotificationManager.swift"
          grep -nF 'width: 120, height: 40' "$FILE"
          grep -nF 'slider.sendActions(for: .valueChanged)' "$FILE"
          grep -nF 'applyVolume(0.05)' "$FILE"
          grep -nF 'applyVolume(0.20)' "$FILE"
          grep -nF 'applyVolume(0.50)' "$FILE"
          grep -nF 'Kiosk system volume verification:' "$FILE"

      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Sources/App/Notifications/NotificationManager.swift
          git diff --cached --check
          git commit -m 'Restore robust iOS 26 kiosk volume control'
          git push origin HEAD:native-kiosk-audio-main
