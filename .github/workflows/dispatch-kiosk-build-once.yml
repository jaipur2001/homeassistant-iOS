name: Dispatch Native Kiosk Main Build Once

on:
  push:
    branches:
      - native-kiosk-audio-main
    paths:
      - .github/workflows/dispatch-kiosk-build-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch native kiosk IPA build on main branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build-native-kiosk-audio-main.yml \
            --repo "${{ github.repository }}" \
            --ref native-kiosk-audio-main
