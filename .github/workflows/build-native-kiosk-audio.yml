name: Build Native Kiosk Audio IPA

on:
  workflow_dispatch:
  push:
    branches:
      - native-kiosk-audio

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer

jobs:
  build:
    name: Build unsigned iOS app
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      # =====================================================================
      # Repository
      # =====================================================================

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # =====================================================================
      # Umgebung anzeigen
      # =====================================================================

      - name: Environment
        run: |
          set -euo pipefail

          echo "Xcode:"
          xcodebuild -version

          echo ""
          echo "Swift:"
          swift --version

          echo ""
          echo "Commit:"
          git rev-parse HEAD

          echo ""
          echo "Branch:"
          git branch --show-current

      # =====================================================================
      # Swift Package Manager
      #
      # KEIN -sdk iphoneos!
      #
      # Xcode muss selbst entscheiden, welche Abhängigkeiten für iOS bzw.
      # watchOS mit welchem SDK gebaut werden.
      # =====================================================================

      - name: Resolve Swift packages
        run: |
          set -euo pipefail

          xcodebuild \
            -project HomeAssistant.xcodeproj \
            -scheme App-Debug \
            -resolvePackageDependencies

      # =====================================================================
      # Unsigned iOS Device Build
      #
      # Wichtig:
      #
      #   -destination generic/platform=iOS
      #
      # aber bewusst KEIN:
      #
      #   -sdk iphoneos
      #
      # Sonst werden auch die watchOS-Abhängigkeiten auf iphoneos gezwungen
      # und Shared-iOS / Shared-watchOS kollidieren miteinander.
      # =====================================================================

      - name: Build unsigned device app
        run: |
          set -euo pipefail

          mkdir -p "$PWD/build"

          xcodebuild \
            -project HomeAssistant.xcodeproj \
            -scheme App-Debug \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build \
            | tee "$PWD/build/xcodebuild.log"

      # =====================================================================
      # Build-Produkt suchen
      # =====================================================================

      - name: Locate application bundle
        id: app
        run: |
          set -euo pipefail

          PRODUCT_DIR="$PWD/build/DerivedData/Build/Products/Debug-iphoneos"

          echo "Build products:"
          find "$PWD/build/DerivedData/Build/Products" \
            -maxdepth 3 \
            -type d \
            -name '*.app' \
            -print || true

          APP_PATH="$PRODUCT_DIR/Home Assistant.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Home Assistant.app not found at expected path"
            exit 1
          fi

          echo "Application bundle:"
          echo "$APP_PATH"

          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      # =====================================================================
      # Unsigned IPA erstellen
      #
      # Eine IPA ist letztlich ein ZIP mit Payload/<App>.app.
      # Signiert wird anschließend separat.
      # =====================================================================

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="${{ steps.locate_app.outputs.app_path }}"
          IPA_DIR="$PWD/build/ipa"
          PAYLOAD_DIR="$IPA_DIR/Payload"
          IPA_PATH="$IPA_DIR/HomeAssistant-Native-Kiosk-Audio-unsigned.ipa"

          rm -rf "$IPA_DIR"
          mkdir -p "$PAYLOAD_DIR"

          cp -R "$APP_PATH" "$PAYLOAD_DIR/"

          cd "$IPA_DIR"
          zip -qry "$IPA_PATH" Payload

          echo "Created IPA:"
          ls -lh "$IPA_PATH"

      # =====================================================================
      # IPA bereitstellen
      # =====================================================================

      - name: Upload IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: HomeAssistant-NativeKioskAudio-unsigned
          path: build/HomeAssistant-NativeKioskAudio-unsigned.ipa
          if-no-files-found: error

      # =====================================================================
      # Buildlog immer bereitstellen
      # =====================================================================

      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: NativeKioskAudio-xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
