name: Build Native Kiosk Audio IPA

on:
  workflow_dispatch:
  push:
    branches:
      - native-kiosk-audio

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer

jobs:
  build:
    name: Build unsigned iOS app
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      # =====================================================================
      # Repository
      # =====================================================================

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # =====================================================================
      # Umgebung anzeigen
      # =====================================================================

      - name: Environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Xcode:"
          xcodebuild -version

          echo ""
          echo "Swift:"
          swift --version

          echo ""
          echo "Commit:"
          git rev-parse HEAD

          echo ""
          echo "Branch:"
          git branch --show-current

      # =====================================================================
      # Swift Package Manager
      #
      # KEIN -sdk iphoneos!
      #
      # Xcode muss selbst entscheiden, welche Abhängigkeiten für iOS bzw.
      # watchOS mit welchem SDK gebaut werden.
      # =====================================================================

      - name: Resolve Swift packages
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project HomeAssistant.xcodeproj \
            -scheme App-Debug \
            -resolvePackageDependencies

      # =====================================================================
      # Unsigned iOS Device Build
      #
      # Wichtig:
      #
      #   -destination generic/platform=iOS
      #
      # aber bewusst KEIN:
      #
      #   -sdk iphoneos
      #
      # Sonst werden auch die watchOS-Abhängigkeiten auf iphoneos gezwungen
      # und Shared-iOS / Shared-watchOS kollidieren miteinander.
      #
      # ENABLE_DEBUG_DYLIB=NO:
      #
      # Xcode kann bei Debug-Builds ein kleines Stub-Executable erzeugen,
      # welches den eigentlichen App-Code aus:
      #
      #   <AppName>.debug.dylib
      #
      # lädt.
      #
      # Bei unserer manuell erzeugten und anschließend mit Sideloadly
      # signierten IPA führte dies auf dem iPad zu:
      #
      #   Termination Reason: DYLD
      #   Library missing
      #
      # Deshalb wird dieses Debug-Dylib-Layout hier explizit deaktiviert.
      # Das Haupt-Executable enthält damit wieder den eigentlichen App-Code.
      # =====================================================================

      - name: Build unsigned device app
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$PWD/build"

          xcodebuild \
            -project HomeAssistant.xcodeproj \
            -scheme App-Debug \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            ENABLE_DEBUG_DYLIB=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build \
            | tee "$PWD/build/xcodebuild.log"

      # =====================================================================
      # Build-Produkt suchen
      # =====================================================================

      - name: Locate application bundle
        id: locate_app
        shell: bash
        run: |
          set -euo pipefail

          PRODUCT_DIR="$PWD/build/DerivedData/Build/Products/Debug-iphoneos"

          echo "Build products:"
          find "$PWD/build/DerivedData/Build/Products" \
            -maxdepth 3 \
            -type d \
            -name '*.app' \
            -print || true

          APP_PATH="$(
            find "$PRODUCT_DIR" \
              -maxdepth 1 \
              -type d \
              -name 'Home Assistant*.app' \
              -print \
              -quit
          )"

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::Home Assistant application bundle not found in $PRODUCT_DIR"
            exit 1
          fi

          INFO_PLIST="$APP_PATH/Info.plist"

          if [ ! -f "$INFO_PLIST" ]; then
            echo "::error::Info.plist not found: $INFO_PLIST"
            exit 1
          fi

          ORIGINAL_EXECUTABLE="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$INFO_PLIST"
          )"

          if [ -z "$ORIGINAL_EXECUTABLE" ]; then
            echo "::error::CFBundleExecutable is empty"
            exit 1
          fi

          if [ ! -f "$APP_PATH/$ORIGINAL_EXECUTABLE" ]; then
            echo "::error::Executable not found: $APP_PATH/$ORIGINAL_EXECUTABLE"
            exit 1
          fi

          echo ""
          echo "Application bundle:"
          echo "$APP_PATH"

          echo ""
          echo "CFBundleExecutable:"
          echo "$ORIGINAL_EXECUTABLE"

          echo ""
          echo "Executable:"
          ls -lh "$APP_PATH/$ORIGINAL_EXECUTABLE"

          echo ""
          echo "Mach-O dependencies of original executable:"
          otool -L "$APP_PATH/$ORIGINAL_EXECUTABLE" || true

          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      # =====================================================================
      # Unsigned IPA erstellen
      #
      # Home Assistant erzeugt aktuell:
      #
      #   Home Assistant Δ.app
      #   Home Assistant Δ
      #
      # Sideloadly verarbeitet den Unicode-Namen nicht korrekt.
      #
      # Deshalb:
      #
      #   Home Assistant Δ.app  -> HomeAssistant.app
      #   Home Assistant Δ      -> HomeAssistant
      #
      # Zusätzlich wird die eingebettete Watch-App entfernt.
      #
      # Hintergrund:
      #
      # Sideloadly ändert beim Signieren die Bundle-ID der Haupt-App.
      # Die Watch-App enthält jedoch noch den ursprünglichen
      # WKCompanionAppBundleIdentifier.
      #
      # iOS/iPadOS lehnt diese Kombination mit
      # InvalidCompanionAppBundleIdentifier ab.
      # =====================================================================

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="${{ steps.locate_app.outputs.app_path }}"

          IPA_DIR="$PWD/build/ipa"
          PAYLOAD_DIR="$IPA_DIR/Payload"

          NORMALIZED_APP="$PAYLOAD_DIR/HomeAssistant.app"
          NORMALIZED_EXECUTABLE="HomeAssistant"

          IPA_PATH="$IPA_DIR/HomeAssistant-Native-Kiosk-Audio-unsigned.ipa"

          echo "Source application bundle:"
          echo "$APP_PATH"

          echo ""
          echo "Preparing IPA directory..."

          rm -rf "$IPA_DIR"
          mkdir -p "$PAYLOAD_DIR"

          # ---------------------------------------------------------------
          # App-Bundle kopieren
          #
          # ditto erhält Dateirechte und Symlinks sauber.
          # ---------------------------------------------------------------

          ditto \
            "$APP_PATH" \
            "$NORMALIZED_APP"

          INFO_PLIST="$NORMALIZED_APP/Info.plist"

          if [ ! -f "$INFO_PLIST" ]; then
            echo "::error::Copied Info.plist not found: $INFO_PLIST"
            exit 1
          fi

          # ---------------------------------------------------------------
          # Ursprüngliches Executable bestimmen
          # ---------------------------------------------------------------

          ORIGINAL_EXECUTABLE="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$INFO_PLIST"
          )"

          echo ""
          echo "Original CFBundleExecutable:"
          echo "$ORIGINAL_EXECUTABLE"

          if [ -z "$ORIGINAL_EXECUTABLE" ]; then
            echo "::error::CFBundleExecutable is empty"
            exit 1
          fi

          ORIGINAL_EXECUTABLE_PATH="$NORMALIZED_APP/$ORIGINAL_EXECUTABLE"

          if [ ! -f "$ORIGINAL_EXECUTABLE_PATH" ]; then
            echo "::error::Original executable not found:"
            echo "$ORIGINAL_EXECUTABLE_PATH"
            exit 1
          fi

          # ---------------------------------------------------------------
          # Vor dem Umbenennen Mach-O-Abhängigkeiten anzeigen
          # ---------------------------------------------------------------

          echo ""
          echo "Original executable Mach-O dependencies:"
          otool -L "$ORIGINAL_EXECUTABLE_PATH"

          # ---------------------------------------------------------------
          # Sicherheitsprüfung:
          #
          # Nach ENABLE_DEBUG_DYLIB=NO darf das Haupt-Executable bereits
          # hier keine *.debug.dylib mehr referenzieren.
          # ---------------------------------------------------------------

          echo ""
          echo "Checking original executable for debug dylib dependency..."

          if otool -L "$ORIGINAL_EXECUTABLE_PATH" \
            | grep -E '\.debug\.dylib([[:space:]]|$)' >/dev/null; then

            echo "::error::Original executable still references a debug dylib:"
            otool -L "$ORIGINAL_EXECUTABLE_PATH" \
              | grep -E '\.debug\.dylib([[:space:]]|$)' || true

            exit 1
          fi

          echo "No debug dylib dependency found in original executable."

          # ---------------------------------------------------------------
          # Executable auf ASCII-Namen normalisieren
          # ---------------------------------------------------------------

          echo ""
          echo "Renaming executable:"
          echo "  $ORIGINAL_EXECUTABLE"
          echo "  ->"
          echo "  $NORMALIZED_EXECUTABLE"

          mv \
            "$ORIGINAL_EXECUTABLE_PATH" \
            "$NORMALIZED_APP/$NORMALIZED_EXECUTABLE"

          # ---------------------------------------------------------------
          # Info.plist aktualisieren
          # ---------------------------------------------------------------

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleExecutable $NORMALIZED_EXECUTABLE" \
            "$INFO_PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleName HomeAssistant" \
            "$INFO_PLIST" || true

          # ---------------------------------------------------------------
          # Eingebettete Apple-Watch-App entfernen
          #
          # Für die iPad-Kiosk-Anwendung wird die Watch-App nicht benötigt.
          # Dadurch vermeiden wir den Fehler:
          #
          # InvalidCompanionAppBundleIdentifier
          # ---------------------------------------------------------------

          echo ""
          echo "Embedded content before cleanup:"

          find "$NORMALIZED_APP" \
            -maxdepth 4 \
            -type d \
            \( -name '*.app' -o -name 'Watch' \) \
            -print || true

          if [ -d "$NORMALIZED_APP/Watch" ]; then
            echo ""
            echo "Removing embedded Watch directory:"
            echo "$NORMALIZED_APP/Watch"

            rm -rf "$NORMALIZED_APP/Watch"
          else
            echo ""
            echo "No embedded Watch directory found."
          fi

          # ---------------------------------------------------------------
          # Prüfen, ob irgendwo innerhalb des Haupt-Bundles weiterhin eine
          # Watch-App existiert.
          # ---------------------------------------------------------------

          REMAINING_WATCH_APP="$(
            find "$NORMALIZED_APP" \
              -type d \
              -name '*Watch*.app' \
              -print \
              -quit || true
          )"

          if [ -n "$REMAINING_WATCH_APP" ]; then
            echo "::error::Embedded Watch application still present:"
            echo "$REMAINING_WATCH_APP"
            exit 1
          fi

          # ---------------------------------------------------------------
          # Normalisiertes Bundle überprüfen
          # ---------------------------------------------------------------

          FINAL_EXECUTABLE="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$INFO_PLIST"
          )"

          echo ""
          echo "Normalized CFBundleExecutable:"
          echo "$FINAL_EXECUTABLE"

          if [ "$FINAL_EXECUTABLE" != "$NORMALIZED_EXECUTABLE" ]; then
            echo "::error::CFBundleExecutable normalization failed"
            exit 1
          fi

          if [ ! -f "$NORMALIZED_APP/$NORMALIZED_EXECUTABLE" ]; then
            echo "::error::Normalized executable does not exist:"
            echo "$NORMALIZED_APP/$NORMALIZED_EXECUTABLE"
            exit 1
          fi

          if [ ! -x "$NORMALIZED_APP/$NORMALIZED_EXECUTABLE" ]; then
            echo "::error::Normalized executable is not executable"
            exit 1
          fi

          if [ -d "$NORMALIZED_APP/Watch" ]; then
            echo "::error::Watch directory still exists"
            exit 1
          fi

          echo ""
          echo "Normalized executable:"
          ls -lh "$NORMALIZED_APP/$NORMALIZED_EXECUTABLE"

          echo ""
          echo "Executable type:"
          file "$NORMALIZED_APP/$NORMALIZED_EXECUTABLE"

          echo ""
          echo "Normalized executable Mach-O dependencies:"
          otool -L "$NORMALIZED_APP/$NORMALIZED_EXECUTABLE"

          echo ""
          echo "Checking normalized executable for debug dylib dependency..."

          if otool -L "$NORMALIZED_APP/$NORMALIZED_EXECUTABLE" \
            | grep -E '\.debug\.dylib([[:space:]]|$)' >/dev/null; then

            echo "::error::Normalized executable still references a debug dylib:"
            otool -L "$NORMALIZED_APP/$NORMALIZED_EXECUTABLE" \
              | grep -E '\.debug\.dylib([[:space:]]|$)' || true

            exit 1
          fi

          echo "No debug dylib dependency found in normalized executable."

          echo ""
          echo "Important Info.plist values:"

          echo ""
          echo "CFBundleIdentifier:"
          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleIdentifier' \
            "$INFO_PLIST" || true

          echo ""
          echo "CFBundleName:"
          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleName' \
            "$INFO_PLIST" || true

          echo ""
          echo "CFBundleDisplayName:"
          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleDisplayName' \
            "$INFO_PLIST" || true

          echo ""
          echo "CFBundleExecutable:"
          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleExecutable' \
            "$INFO_PLIST"

          echo ""
          echo "Embedded applications after cleanup:"

          find "$NORMALIZED_APP" \
            -mindepth 1 \
            -type d \
            -name '*.app' \
            -print || true

          # ---------------------------------------------------------------
          # IPA erzeugen
          # ---------------------------------------------------------------

          echo ""
          echo "Creating IPA..."

          cd "$IPA_DIR"

          zip -qry \
            "HomeAssistant-Native-Kiosk-Audio-unsigned.ipa" \
            Payload

          if [ ! -f "$IPA_PATH" ]; then
            echo "::error::IPA was not created"
            exit 1
          fi

          echo ""
          echo "Created IPA:"
          ls -lh "$IPA_PATH"

      # =====================================================================
      # Fertige IPA vollständig kontrollieren
      #
      # Wir entpacken die tatsächlich erzeugte IPA noch einmal.
      # Dadurch prüfen wir genau die Struktur, die später auch Sideloadly
      # verarbeitet.
      # =====================================================================

      - name: Verify unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          IPA_PATH="$PWD/build/ipa/HomeAssistant-Native-Kiosk-Audio-unsigned.ipa"
          VERIFY_DIR="$PWD/build/ipa-verify"

          if [ ! -f "$IPA_PATH" ]; then
            echo "::error::IPA does not exist:"
            echo "$IPA_PATH"
            exit 1
          fi

          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"

          # ---------------------------------------------------------------
          # ZIP-Struktur prüfen
          # ---------------------------------------------------------------

          echo "Testing ZIP integrity..."

          unzip -t "$IPA_PATH"

          # ---------------------------------------------------------------
          # IPA entpacken
          # ---------------------------------------------------------------

          echo ""
          echo "Extracting IPA..."

          unzip -q \
            "$IPA_PATH" \
            -d "$VERIFY_DIR"

          APP_PATH="$VERIFY_DIR/Payload/HomeAssistant.app"
          INFO_PLIST="$APP_PATH/Info.plist"

          # ---------------------------------------------------------------
          # Haupt-App prüfen
          # ---------------------------------------------------------------

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Payload/HomeAssistant.app not found"
            exit 1
          fi

          if [ ! -f "$INFO_PLIST" ]; then
            echo "::error::Info.plist not found in packaged IPA"
            exit 1
          fi

          EXECUTABLE="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$INFO_PLIST"
          )"

          echo ""
          echo "Packaged CFBundleExecutable:"
          echo "$EXECUTABLE"

          if [ "$EXECUTABLE" != "HomeAssistant" ]; then
            echo "::error::Unexpected CFBundleExecutable:"
            echo "$EXECUTABLE"
            exit 1
          fi

          if [ ! -f "$APP_PATH/$EXECUTABLE" ]; then
            echo "::error::Executable missing from packaged IPA:"
            echo "$APP_PATH/$EXECUTABLE"
            exit 1
          fi

          if [ ! -x "$APP_PATH/$EXECUTABLE" ]; then
            echo "::error::Packaged executable is not executable"
            exit 1
          fi

          echo ""
          echo "Packaged executable:"
          ls -lh "$APP_PATH/$EXECUTABLE"

          echo ""
          echo "Executable type:"
          file "$APP_PATH/$EXECUTABLE"

          # ---------------------------------------------------------------
          # Mach-O-Abhängigkeiten prüfen
          #
          # Das Haupt-Executable darf bei unserer Sideload-IPA keine
          # <AppName>.debug.dylib benötigen.
          #
          # Genau diese fehlende Abhängigkeit führte auf dem iPad zu:
          #
          #   Termination Reason: DYLD
          #   Library missing
          #
          # ---------------------------------------------------------------

          echo ""
          echo "Mach-O dependencies:"
          otool -L "$APP_PATH/$EXECUTABLE"

          echo ""
          echo "Checking for debug dylib dependency..."

          if otool -L "$APP_PATH/$EXECUTABLE" \
            | grep -E '\.debug\.dylib([[:space:]]|$)' >/dev/null; then

            echo "::error::Main executable still references a debug dylib:"
            otool -L "$APP_PATH/$EXECUTABLE" \
              | grep -E '\.debug\.dylib([[:space:]]|$)' || true

            exit 1
          fi

          echo "No debug dylib dependency found."

          # ---------------------------------------------------------------
          # Bundle Identifier anzeigen
          # ---------------------------------------------------------------

          echo ""
          echo "Bundle identifier:"

          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleIdentifier' \
            "$INFO_PLIST"

          # ---------------------------------------------------------------
          # Sicherstellen, dass keine Watch-App mehr vorhanden ist
          # ---------------------------------------------------------------

          if [ -d "$APP_PATH/Watch" ]; then
            echo "::error::Embedded Watch directory still present"
            exit 1
          fi

          WATCH_APP="$(
            find "$APP_PATH" \
              -type d \
              -name '*Watch*.app' \
              -print \
              -quit || true
          )"

          if [ -n "$WATCH_APP" ]; then
            echo "::error::Embedded Watch application still present:"
            echo "$WATCH_APP"
            exit 1
          fi

          echo ""
          echo "No embedded Watch app present."

          # ---------------------------------------------------------------
          # Verzeichnisstruktur anzeigen
          # ---------------------------------------------------------------

          echo ""
          echo "Embedded application bundles:"

          find "$APP_PATH" \
            -mindepth 1 \
            -type d \
            -name '*.app' \
            -print || true

          # ---------------------------------------------------------------
          # Abschluss
          # ---------------------------------------------------------------

          echo ""
          echo "============================================================"
          echo "IPA verification successful."
          echo "============================================================"
          echo ""
          echo "CFBundleExecutable:"
          echo "$EXECUTABLE"
          echo ""
          echo "No embedded Watch app present."
          echo "No debug dylib dependency present."
          echo ""
          echo "IPA is ready for external signing."

      # =====================================================================
      # IPA als GitHub Artifact bereitstellen
      # =====================================================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HomeAssistant-Native-Kiosk-Audio-unsigned
          path: build/ipa/HomeAssistant-Native-Kiosk-Audio-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      # =====================================================================
      # Xcode-Buildlog immer bereitstellen
      # =====================================================================

      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: NativeKioskAudio-xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
