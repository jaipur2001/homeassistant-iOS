name: Kiosk Main Maintenance Once

on:
  push:
    branches:
      - native-kiosk-audio-main
    paths:
      - .github/workflows/kiosk-maintenance-once.yml

permissions:
  contents: write

jobs:
  maintain:
    name: Format kiosk Swift sources
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: native-kiosk-audio-main

      - name: Format kiosk Swift sources
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$PWD:$PWD" \
            -w "$PWD" \
            ghcr.io/nicklockwood/swiftformat:0.53.1 \
            --config .swiftformat \
            Sources/Shared/Environment/AppConstants.swift \
            Sources/Shared/API/HAAPI.swift \
            Sources/App/Notifications/NotificationManagerLocalPushInterfaceExtension.swift \
            Sources/App/Notifications/NotificationManager.swift

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$PWD:$PWD" \
            -w "$PWD" \
            ghcr.io/nicklockwood/swiftformat:0.53.1 \
            --lint --config .swiftformat \
            Sources/Shared/Environment/AppConstants.swift \
            Sources/Shared/API/HAAPI.swift \
            Sources/App/Notifications/NotificationManagerLocalPushInterfaceExtension.swift \
            Sources/App/Notifications/NotificationManager.swift

          git diff --check
          git status --short

      - name: Commit formatted Swift sources
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- \
            Sources/Shared/Environment/AppConstants.swift \
            Sources/Shared/API/HAAPI.swift \
            Sources/App/Notifications/NotificationManagerLocalPushInterfaceExtension.swift \
            Sources/App/Notifications/NotificationManager.swift; then
            echo 'Nothing to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            Sources/Shared/Environment/AppConstants.swift \
            Sources/Shared/API/HAAPI.swift \
            Sources/App/Notifications/NotificationManagerLocalPushInterfaceExtension.swift \
            Sources/App/Notifications/NotificationManager.swift

          git commit -m 'Format kiosk patch for upstream CI'
          git push origin HEAD:native-kiosk-audio-main
