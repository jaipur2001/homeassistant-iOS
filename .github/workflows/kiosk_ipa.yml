name: Kiosk IPA Build

on:
  push:
    branches:
      - kiosk-recovery-signals
  workflow_dispatch:

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
  FASTLANE_SKIP_UPDATE_CHECK: true
  FASTLANE_XCODE_LIST_TIMEOUT: 60
  FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 180
  HOMEBREW_NO_INSTALL_CLEANUP: TRUE
  BUNDLE_PATH: vendor/bundle

jobs:
  build-ios:
    runs-on: xcode-27
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b  # v1.321.0
        with:
          ruby-version: .ruby-version

      - name: Cache gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-kiosk-gems-${{ hashFiles('.ruby-version', '**/Gemfile.lock') }}

      - name: Install Gems
        run: bundle install --jobs 4 --retry 3

      - name: Report selected Xcode
        run: |
          set -euo pipefail
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"
          xcodebuild -version

      - name: Resolve Swift packages
        run: >-
          xcodebuild -resolvePackageDependencies
          -project HomeAssistant.xcodeproj
          -scheme HomeAssistant

      - name: Build unsigned iOS app for Sideloadly
        run: |
          set -euo pipefail
          rm -rf build/kiosk
          mkdir -p build/kiosk/Payload

          xcodebuild \
            -project HomeAssistant.xcodeproj \
            -scheme HomeAssistant \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/kiosk/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          APP_PATH=$(find build/kiosk/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No iOS .app bundle found"
            exit 1
          fi

          echo "Packaging $APP_PATH"
          cp -R "$APP_PATH" build/kiosk/Payload/
          cd build/kiosk
          /usr/bin/zip -qry "../HA-Kiosk-unsigned.ipa" Payload

      - name: Dump version information
        if: always()
        run: cat Configuration/Version.xcconfig

      - name: Upload iOS IPA
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ha-kiosk-unsigned.ipa
          path: build/HA-Kiosk-unsigned.ipa
          if-no-files-found: error

